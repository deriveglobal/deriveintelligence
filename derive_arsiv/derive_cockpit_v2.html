<style>

     linear-gradient(#04060a,#05070a);
     color:var(--ink);font-family:var(--font);overflow:hidden}

     background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);
     background-size:44px 44px;opacity:.05}

     padding:0 16px;background:linear-gradient(#0a0f14,#070b0f);border-bottom:1px solid var(--hair2)}

  .tf button{font-family:var(--mono);background:#0b1218;color:var(--ink2);border:1px solid var(--hair);border-radius:5px;
     padding:4px 10px;font-size:11px;cursor:pointer;letter-spacing:.5px}
  .tf button[aria-pressed="true"]{background:rgba(57,214,229,.14);color:var(--cyan);border-color:var(--hair2);box-shadow:0 0 10px rgba(57,214,229,.25)}
  .rt{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:11px;color:var(--ink2)}
  .lamp{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;
     padding:3px 8px;border-radius:4px;border:1px solid var(--hair);background:#0a1015}
  .lamp b{width:7px;height:7px;border-radius:50%;display:inline-block}
  .lg{background:var(--grn);box-shadow:0 0 8px var(--grn)} .la{background:var(--amb);box-shadow:0 0 8px var(--amb)}
  .lr{background:var(--red);box-shadow:0 0 9px var(--red);animation:blink 1.4s steps(1) infinite} .lc{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  @keyframes blink{50%{opacity:.35}}

  /* annunciator strip */
  .annun{position:fixed;top:46px;left:0;right:0;height:36px;z-index:39;display:flex;align-items:center;gap:8px;
     padding:0 16px;background:#070b0f;border-bottom:1px solid var(--hair);overflow-x:auto}
  .ann{font-family:var(--mono);font-size:10.5px;letter-spacing:.8px;padding:4px 10px;border-radius:4px;white-space:nowrap;
     border:1px solid var(--hair);color:var(--ink2);display:flex;align-items:center;gap:7px;cursor:default}

  .ann.on-a{color:#ffe6b8;border-color:rgba(245,183,60,.45);background:rgba(245,183,60,.07)}
  .ann.on-g{color:#c7f6e2;border-color:rgba(55,224,160,.4);background:rgba(55,224,160,.06)}
  .ann .d{width:8px;height:8px;border-radius:2px}

  /* canvas + panels */
  #cv{position:absolute;top:82px;left:0;right:0;bottom:0;overflow:auto;z-index:1}
  .pnl{position:absolute;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--hair);
     border-radius:9px;box-shadow:var(--glow);display:flex;flex-direction:column;overflow:hidden;min-width:210px;min-height:120px}
  .pnl.drag{z-index:30;box-shadow:0 0 0 1px var(--hair2),0 14px 40px rgba(0,0,0,.5)}
  .ph{height:28px;display:flex;align-items:center;gap:8px;padding:0 10px;cursor:grab;user-select:none;
     background:linear-gradient(#0e151b,#0b1116);border-bottom:1px solid var(--hair)}
  .ph .t{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--cyan);font-weight:600}

  .gauge{background:#0a1015;border:1px solid var(--hair);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:2px}

  .gauge .big small{font-size:11px;color:var(--ink2)}
  .gauge .was{font-family:var(--mono);font-size:10px;color:var(--mut)}
  .gauge .dl{font-family:var(--mono);font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
  .up{color:var(--grn)} .down{color:var(--red)} .flat{color:var(--ink2)}

  .brow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:11.5px}
  .brow .nm{width:96px;flex:0 0 96px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .bar{height:11px;border-radius:3px;flex:0 0 auto;min-width:2px;box-shadow:0 0 8px rgba(0,0,0,.3)}
  .brow .v{font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap}
  .mj{font-family:var(--mono);font-weight:600;padding:0 5px;border-radius:3px}
  .flag{color:#ffd7d9}
  .why{background:transparent;border:1px solid var(--hair2);color:var(--cyan);border-radius:5px;padding:2px 8px;font-size:10.5px;cursor:pointer;font-family:var(--mono)}
  .drill{margin:7px 0 4px;padding:9px;border:1px solid var(--hair);border-radius:7px;background:#0a1015;font-size:11.5px;line-height:1.5;color:var(--ink2);display:none}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .cp{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid var(--hair);color:var(--ink2)}
  .cp.n{color:#ffb0b4;border-color:rgba(255,88,96,.4)} .cp.p{color:#9ff0cf;border-color:rgba(55,224,160,.4)}
  .oneri{margin-top:7px;color:var(--ink);border-left:2px solid var(--cyan);padding-left:8px}

  /* signals pager */
  .sig-wrap{height:100%;display:flex;flex-direction:column}
  .sig-card{flex:1;display:flex;flex-direction:column;gap:7px;overflow:auto}
  .sig-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
  .sig-oz{font-size:13px;font-weight:600;line-height:1.35;color:var(--ink)}
  .sig-an{font-size:11.5px;line-height:1.5;color:var(--ink2)}
  .sig-nav{display:flex;align-items:center;gap:8px;margin-top:8px;border-top:1px solid var(--hair);padding-top:7px}
  .sig-nav button{font-family:var(--mono);background:#0b1218;border:1px solid var(--hair2);color:var(--cyan);border-radius:5px;width:30px;height:24px;cursor:pointer}
  .sig-nav .pos{font-family:var(--mono);font-size:10.5px;color:var(--mut)}
  .relpill{font-family:var(--mono);font-size:9.5px;padding:1px 6px;border-radius:3px;border:1px solid var(--hair)}
  .r-k{color:var(--grn)} .r-y{color:var(--amb)} .r-v{color:var(--red)}

  svg{display:block;width:100%;overflow:visible}
  .ax{fill:var(--mut);font-size:9px;font-family:var(--mono)}
  .gl{stroke:var(--hair);stroke-width:1}
  .foot{position:fixed;bottom:0;left:0;right:0;height:0}
</style>
</head>

en": "kesin"}, {"bolum": "marka-marj", "tip": "marj-dusus", "ozet": "CONTINENTAL: marj %13,9 → %1,6 (ciro 38.2→66.7M)", "anlati": "Continental'de tablo oldukça net: önceki dönemde %13,9 olan kâr marjı bugün %1,6'ya gerilemiş durumda ve bunun arkında birbirine bağlı iki temel sorun var. İlki, satış karmanızın düşük marjlı — hatta zararlı — ürünlere doğru belirgin biçimde kayması; en çarpıcı örnek 205/55R16 ebadı, bu ürünü altı ayda 139 adetten 561 adede taşımışsınız, ancak söz konusu ebatta marj %-6,7, yani her satışta fiilen zarar ediyorsunuz ve benzer durumda olan başka ebatlar da mevcut. İkinci sorun ise maliyet tarafında: birim maliyetlerdeki artış tek başına marjınıza yaklaşık 3,5 milyon TL baskı yapmış; bu baskının büyük olasılıkla kur ve enflasyon kaynaklı olduğunu düşünüyorum, nitekim dolar bu dönemde %22 artmış, ancak elimizdeki kur verisi sınırlı olduğu için bunu kesin bir sebep olarak sunmak doğru olmaz, doğrulanmalı. Öte yandan şunu da belirtmeliyim: 3 tedarikçi teşviki henüz maliyetlere yansıtılmamış, dolayısıyla net marjın bu rakamdan daha iyi çıkması mümkün. Genel tabloya temkinli bakmakta fayda var; mevcut veriyle kesin bir yargıya varmak", "oneri": "Önerim: hem maliyeti artan ürünlerde zam/tedarikçi primi pazarlığı yapın, hem de zararına büyüyen ebatları ya fiyatlandırın ya da hacmini kısın.", "guven": "kismi"}, {"bolum": "marka-trend", "tip": "ciro↑marj↓", "ozet": "CONTINENTAL: ciro %72 arttı (40.4→69.5M) ama marj oranı %15→%9 düştü. Fiyat/iskonto gözden geçir.", "anlati": null, "oneri": null, "guven": "kesin"}, {"bolum": "marka-trend", "tip": "ciro-düşüş", "ozet": "SAILUN: ciro %-77 düştü (143.2→32.4M). Neden — stok? tedarik? rakip? müşteri kaybı?", "anlati": null, "oneri": null, "guven": "kesin"}, {"bolum": "marka-trend", "tip": "ciro-düşüş", "ozet": "AVON+: ciro %-52 düştü (15.1→7.2M). Neden — stok? tedarik? rakip? müşteri kaybı?", "anlati": null, "oneri": null, "guven": "kesin"}, {"bolum": "musteri", "tip": "tahsilat-riski", "ozet": "YEDİ OTO MAMÜLLERİ SAN.TİC.LTD.ŞTİ.: net risk 30.5M (vadesi geçmiş 19.0M)", "anlati": "YEDİ OTO MAMÜLLERİ SAN.TİC.LTD.ŞTİ.'nin son 6 aylık performansına baktığımızda, cirosunun 13,2 milyon TL'den 20,2 milyon TL'ye çıkarak %53 büyüdüğünü görüyoruz; bu, dikkat edilmesi gereken bir büyüme fırsatına işaret ediyor. Vadesi geçmiş bakiyenin 19,0 milyon TL ile mevcut 15,0 milyon TL'lik kredi limitinin üzerinde olması ilk bakışta endişe verici görünse de ortalama tahsilat süresinin yalnızca 8 gün olması, bu rakamın büyük ihtimalle anlık bir kesit bakiyesi olduğuna, kalıcı bir tahsilat riski olmadığına işaret ediyor; dolayısıyla tek taraflı bir okuma yanıltıcı olacaktır. Öte yandan 60 günlük vadeye karşın ortalama tahsilat süresinin 51 gün olması, müşterinin vadelerine genel olarak uyumlu davrandığını gösteriyor. Kredi limitinin güncel olmayabileceği de göz önüne alındığında, büyüyen ciroya paralel olarak limitin gözden geçirilmesi değerlendirilebilir.", "oneri": "Öneri: tahsilat planı; yeni sevkiyatı bakiye netleşene kadar gözden geçir.", "guven": "yaklasik"}, {"bolum": "musteri", "tip": "ciro-dususu", "ozet": "E TİCARET PAZARAMA: ciro 0.7→0.2M", "anlati": "E Ticaret Pazarама'nın son 6 aylık performansına bakıldığında ciddi bir ciro erimesi göze çarpmaktadır: ciro 0,7 milyon TL'den 0,2 milyon TL'ye inerek %-69 oranında gerilemiştir. Vadesi geçmiş bakiye olarak kayıtlarda 14,7 milyon TL görünmekle birlikte, bu rakamı doğrudan tahsilat riski olarak okumak yanıltıcı olur; ortalama tahsilat süresi 0 gün olduğundan söz konusu bakiyenin anlık bir snapshot yansıması olduğu kuvvetle muhtemeldir. Bununla birlikte 14,7 milyon TL'lik bu rakam müşterinin tahmini yıllık cirosunun (~0,4 milyon TL) çok üzerinde olduğundan veri bütünlüğü açısından şüphe uyandırmakta olup muhasebeyle mutlaka teyit edilmelidir. Tek taraflı bir okuma yanıltıcı sonuçlar doğurabileceğinden bu müşteri için hem ciro trendi hem de bakiye tutarlılığı birlikte değerlendirilmelidir.", "oneri": "Öneri: önce bu bakiyeyi muhasebeyle doğrula; kirli olabilir.", "guven": "kismi"}, {"bolum": "musteri", "tip": "tahsilat-riski", "ozet": "İSB LASTİK KAPLAMA LOJ.SAN.VE TİC.LTD.ŞTİ.: net risk 13.5M (vadesi geçmiş 1.1M)", "anlati": "İSB LASTİK KAPLAMA LOJ.SAN.VE TİC.LTD.ŞTİ. için dikkat edilmesi gereken kritik bir netleştirme var: ilk bakışta vadesi geçmiş 1,1 milyon TL alacak görünse de tablonun tamamına bakıldığında bu firmaya bizim de 4,0 milyon TL borcumuz bulunuyor ve net pozisyon yaklaşık 13,5 milyon TL düzeyinde seyrediyor. Dolayısıyla yalnızca alacak tarafına odaklanmak yanıltıcı bir tablo ortaya çıkarır; doğru aksiyonu alabilmek için öncelikle karşılıklı mutabakat ve takas sürecinin tamamlanması gerekiyor. Bu veriler yaklaşık nitelikte olup kesin rakamlar mutabakat sonrasında netleşecektir.", "oneri": "Öneri: alacak-borç mutabakatı/takas; net başabaşsa öncelik düşük.", "guven": "yaklasik"}, {"bolum": "musteri", "tip": "ciro-dususu", "ozet": "FEVZİ BİLEN: ciro 3.8→0.0M", "anlati": "Son 6 ayda hiç alım gerçekleştirmeyen bu müşteri, önceki 6 ayda 3,8 milyon TL ciro üretmişti; sessiz kayıp riski açısından öncelikli takip gerektiren bir profil söz konusu. Ödeme davranışı incelendiğinde ortalama tahsilat süresinin 13 gün olduğu görülüyor; peşin ve kredi kartı tek çekim vade yapısı düşünüldüğünde bu süre makul seyretmekte, yani geçmiş dönemdeki ticari ilişki finansal açıdan sorunsuz yürümüş. Bununla birlikte, güçlü ödeme sicrine rağmen ani alım durmasının tek başına olumlu yorumlanması yanıltıcı olur; alım kesilmesinin arkasındaki nedenin — rakip tedarikçiye geçiş, iş hacmi daralması ya da başka bir etken — sorumlu temsilci aracılığıyla sahada netleştirilmesi gerekiyor.", "oneri": "Öneri: temsilci (Fatih Bilen) acil ziyaret etsin; alım neden durdu öğrenilsin.", "guven": "yaklasik"}, {"bolum": "musteri", "tip": "ciro-dususu", "ozet": "T.B.R. LASTİK OTOM.NAK.SAN.DIŞ TİC.LTD.ŞTİ.: ciro 9.2→1.8M", "anlati": "T.B.R. LASTİK OTOM.NAK.SAN.DIŞ TİC.LTD.ŞTİ.'nin son 6 aylık performansına baktığımızda ciddi bir daralma göze çarpıyor: ciro 9,2 milyon TL'den 1,8 milyon TL'ye gerileyerek yaklaşık %80 oranında düşmüş. Buna ek olarak 1,2 milyon TL vadesi geçmiş bakiye bulunuyor; bu rakam portföy riski açısından dikkatle takip edilmesi gereken bir seviye. Öte yandan ortalama tahsilat süresinin 21 gün olması, tanımlı 90 günlük vadenin çok gerisinde kalındığını gösteriyor ve bu durum müşterinin ödeme kapasitesine dair tek taraflı bir okuma yapılmasının yanıltıcı olabileceğine işaret ediyor; zira düşen ciro ile açık bakiyeyi birlikte değerlendirmek, gerçek riski doğru konumlandırmak açısından kritik önem taşıyor.", "oneri": "Öneri: tahsilat planı; yeni sevkiyatı bakiye netleşene kadar gözden geçir.", "guven": "yaklasik"}, {"bolum": "marka-marj", "tip": "marj-dusus", "ozet": "MATADOR: marj %20,0 → %11,9 (ciro 12.3→7.4M)", "anlati": "Matador markasında önceki döneme kıyasla ciddi bir marj erozyonu yaşandığını net biçimde görüyoruz: marj %20'den %11,9'a gerilemiş. Bu düşüşün arkında iki temel dinamik var. Birincisi, satış karması belirgin şekilde düşük marjlı ürünler lehine kaymış; en çarpıcı örnek 195/50R15 ebadı — altı ayda 10 adetten 92 adede taşınan bir hacim söz konusu, ancak bu ürünün marjı yalnızca %7,7; yani fiilen zararına çalışıyorsunuz ve benzer durumda birkaç ebat daha mevcut. İkincisi, birim maliyetler yükselmiş ve bu tek başına marja yaklaşık 0,6 milyon TL baskı uygulamış; elimizdeki kur verisi sınırlı olduğundan bunu kesin bir nedene bağlamak doğru olmaz, bu nedenle temkinli değerlendiriyorum. Öte yandan tablonun bir miktar daha iyi görünme ihtimali var: 3 tedarikçi teşviki henüz maliyetlere yansıtılmamış, dolayısıyla net marj bu rakamın üzerinde çıkabilir. Son olarak, 205/55R16 ebadıyla ilgili alım niyeti sinyalleri geliyor; bu ebadın marj profiline ve stok pozisyonunuza etkisini karardan önce doğrulanmalı.", "oneri": "Önerim: hem maliyeti artan ürünlerde zam/tedarikçi primi pazarlığı yapın, hem de zararına büyüyen ebatları ya fiyatlandırın ya da hacmini kısın.", "guven": "kismi"}, {"bolum": "musteri", "tip": "tahsilat-riski", "ozet": "FARK GROUP OTO LASTİK OTOMOTİV İNŞAAT SANAYİ VE TİCARET LİMİTED ŞİRKETİ: net risk 6.3M (vadesi geçmiş 6.3M)", "anlati": "FARK GROUP OTO LASTİK OTOMOTİVİ değerlendirirken dikkat edilmesi gereken kritik bir nokta var: vadesi geçmiş bakiye 6,3 milyon TL olarak görünüyor ve kayıtlı kredi limiti 0,0 milyon TL — bu teknik olarak limit aşımına işaret ediyor, ancak limitin güncel olup olmadığı ayrıca sorgulanmalı. Öte yandan ortalama tahsilat süresi yalnızca 13 gün; tanımlı vade 90 gün olmasına karşın müşterinin bu kadar hızlı ödeme yapıyor olması, 6,3 milyon TL'lik vadesi geçmiş bakiyenin anlık bir snapshot görüntüsü olduğuna, kalıcı bir tahsilat riski olmadığına kuvvetle işaret ediyor. Dolayısıyla bu iki veriyi ayrı ayrı okumak yanıltıcı olur; vadesi geçmiş rakam tek başına alarm vermeli değil, 13 günlük ortalama tahsilat süresiyle birlikte değerlendirilmeli. Sonuç olarak operasyonel tahsilat performansı oldukça sağlıklı görünmekle birlikte, kredi limiti kaydının güncellenmesi ve anlık bakiyenin nedeninin teyit edilmesi önerilir.", "oneri": "Öneri: tahsilat planı; yeni sevkiyatı bakiye netleşene kadar gözden geçir.", "guven": "yaklasik"}, {"bolum": "musteri", "tip": "ciro-dususu", "ozet": "SEVİNDİM AKARYAKIT NAKLİYE OTOM.DEMİR ÇELİK ÜRÜNLERİ İNŞ.MADEN. GIDA HAY. TARIM SAN.TİC.LTD.ŞTİ: ciro 6.3→1.2M", "anlati": "Sevinidim Akaryakıt Nakliye firmasının durumuna ilişkin dikkat çekici bir gelişmeyi paylaşmak istiyorum. Firmanın cirosu son 6 ayda 6,3 milyon TL'den 1,2 milyon TL'ye gerileyerek yaklaşık %81 oranında keskin bir düşüş sergilemiş; bu tablo, iş hacminde ciddi bir daralmanın yaşandığına işaret ediyor. Öte yandan olumlu bir veri olarak ortalama tahsilat süresi 15 gün olup belirlenen 30 günlük vadenin oldukça gerisinde kalıyor, yani firma tahsilat disiplini açısından şu an için sorun çıkarmıyor. Ancak bu tek olumlu göstergeyi, ciro tarafındaki sert erozyon göz ardı edilerek tek başına değerlendirmek yanıltıcı olacaktır; firmanın toplam risk profilinin bütünüyle takip edilmesini öneririm.", "oneri": "Öneri: ilişkiyi izle.", "guven": "yaklasik"}, {"bolum": "musteri", "tip": "ciro-dususu", "ozet": "BURHAN ÇETİNKAYA OTOMOTİV. LASTİK SAN. TİC. LTD ŞTİ.: ciro 4.6→0.4M", "anlati": "Burhan Çetinkaya Otomotiv Lastik San. Tic. Ltd. Şti.'nin son 6 aylık performansına baktığımızda ciddi bir tablo ile karşılaşıyoruz: ciro 4,6 milyon TL'den 0,4 milyon TL'ye gerilemiş, bu da yaklaşık -%90'lık bir daralmaya işaret ediyor. Öte yandan ortalama tahsilat süresi yalnızca 6 gün olarak gerçekleşmiş; 30 günlük vadeye kıyasla bu oldukça olumlu bir ödeme davranışına işaret etmektedir. Ancak tek taraflı okuma yanıltıcı olur; tahsilat disiplini güçlü görünse de ciroda yaşanan bu sert düşüşü göz ardı etmemek gerekir ve müşterinin ticari hacmindeki bu dramatik küçülmenin arkasındaki nedenlerin yakından incelenmesi önerilir.", "oneri": "Öneri: ilişkiyi izle.", "guven": "yaklasik"}, {"bolum": "musteri", "tip": "ciro-dususu", "ozet": "ANT LOJİSTİK LTD.ŞTİ.: ciro 4.9→0.6M", "anlati": "ANT LOJİSTİK LTD.ŞTİ.'nin son 6 aylık performansına bakıldığında tablo ciddi bir bozulmaya işaret ediyor: ciro 4,9 milyon TL'den 0,6 milyon TL'ye gerileyerek yaklaşık %-87 oranında daralmış. Bu düzeydeki bir ciro kaybı, müşterinin faaliyet hacminde yapısal bir sorun yaşandığına ya da alternatif tedarikçilere yöneldiğine işaret edebilir. Öte yandan ortalama tahsilat süresi 50 gün olarak gerçekleşmiş; tanımlı 90 günlük vadenin henüz altında olsa da düşen ciroyla birlikte değerlendirildiğinde bu verinin tek başına rahatlatıcı okunması yanıltıcı olur, zira küçülen işlem hacmi tahsilat riskini görünürden daha yönetilebilir gösterebilir. Sonuç olarak bu müşteri için risk profilinin yakından izlenmesi, mevcut açık pozisyonun vade disiplini açısından takip altında tutulması öneriyorum.", "oneri": "Öneri: ilişkiyi izle.", "guven": "yaklasik"}, {"bolum": "musteri", "tip": "ciro-dususu", "ozet": "USTAOĞLU LASTİK MARKET OTOMOTİ /* ---- panel engine ---- */
const cv=document.getElementById("cv");
let Z=10;
function panel(id,title,x,y,w,h,rightTxt){
  const p=el("div","pnl");p.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  p.innerHTML=`<div class="ph"><span class="t">${title}</span><span class="r">${rightTxt||""}</span></div><div class="pb"></div><div class="rz"></div>`;
  cv.appendChild(p);
  const head=p.querySelector(".ph"),rz=p.querySelector(".rz");
  head.addEventListener("pointerdown",e=>{e.preventDefault();p.classList.add("drag");p.style.zIndex=++Z;
    const sx=e.clientX,sy=e.clientY,ox=p.offsetLeft,oy=p.offsetTop;
    const mv=ev=>{p.style.left=Math.max(0,ox+ev.clientX-sx)+"px";p.style.top=Math.max(0,oy+ev.clientY-sy)+"px";};
    const up=()=>{p.classList.remove("drag");removeEventListener("pointermove",mv);removeEventListener("pointerup",up);};
    addEventListener("pointermove",mv);addEventListener("pointerup",up);});
  rz.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();p.style.zIndex=++Z;
    const sx=e.clientX,sy=e.clientY,ow=p.offsetWidth,oh=p.offsetHeight;
    const mv=ev=>{p.style.width=Math.max(210,ow+ev.clientX-sx)+"px";p.style.height=Math.max(120,oh+ev.clientY-sy)+"px";};
    const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);};
    addEventListener("pointermove",mv);addEventListener("pointerup",up);});
  return p.querySelector(".pb");
}

/* ---- VITALS (was->now, timeframe) ---- */
let vitBody;
function renderVitals(){
  const T=DATA.trend, n=T.length-1, back=Math.min(TF,n), prev=T[n-back], now=T[n];
  const mk=(lab,key,unit,defk,inv)=>{
    const nw=now[key], ws=prev[key], d=nw-ws, dp=ws?d/ws*100:0;
    const good=inv?d<0:d>0, dir=Math.abs(dp)<0.5?"flat":(good?"up":"down"), ar=d>0?"▲":d<0?"▼":"■";
    return `<div class="gauge"><div class="lab">${lab} ${iBtn(defk)}</div>
      <div class="big num">${M(nw)}<small> ${unit}</small></div>
      <div class="was num">nasıldı: ${M(ws)} <span style="opacity:.6">(${TF}A önce)</span></div>
      <div class="dl ${dir} num">${ar} ${M(Math.abs(dp))}% <span style="color:var(--mut)">${dir==="up"?"iyi":dir==="down"?"dikkat":"sabit"}</span></div></div>`;
  };
  vitBody.innerHTML=`<div class="vit">
    ${mk("Ciro (son ay)","ciro","M₺","ciro",false)}
    ${mk("Stok değeri","stok","M₺","stok_deger",false)}
    ${mk("DSO","dso","gün","dso",true)}
    <div class="gauge"><div class="lab">Şirket marj (12A) ${iBtn("marj")}</div><div class="big num" style="color:var(--amb)">~10,4<small> %</small></div><div class="was">brüt · teşvik öncesi</div><div class="dl flat num">◐ yaklaşık</div></div>
  </div>`;
}

function miniLine(pts,cap,color,defk){
  const wrap=el("div");wrap.style.marginBottom="9px";
  const W=440,H=92,pl=30,pb=15,pt=6,pr=8;
  const ys=pts.map(p=>p.y),mn=Math.min(...ys,0),mx=Math.max(...ys),rg=mx-mn||1;
  const X=i=>pl+i/(pts.length-1)*(W-pl-pr),Y=v=>pt+(1-(v-mn)/rg)*(H-pt-pb);
  let g="";for(let k=0;k<=2;k++){const v=mn+rg*k/2,y=Y(v);g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-5}" y="${y+3}" text-anchor="end">${M(v)}</text>`;}
  const d=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  let dots="";pts.forEach((p,i)=>{if(i%2===0||i===pts.length-1)dots+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.4" fill="${color}"><title>${p.x}: ${M(p.y)}</title></circle>`;});
  let xl="";pts.forEach((p,i)=>{if(i%4===0||i===pts.length-1)xl+=`<text class="ax" x="${X(i).toFixed(1)}" y="${H-4}" text-anchor="middle">${p.x}</text>`;});
  wrap.innerHTML=`<div style="font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:var(--ink2);margin:0 0 3px 2px">${cap} ${iBtn(defk)}</div>
    <svg viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" style="filter:drop-shadow(0 0 3px ${color}88)"/>${g}${dots}${xl}</svg>`;
  return wrap;
}

/* ---- TAHSILAT ---- */
function tahsilatInto(body){
  const risk=DATA.insights.filter(x=>x.tip&&x.tip.includes("tahsilat"));
  body.innerHTML=`<div style="font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.5px">EN YÜKSEK NET RİSK ${iBtn("dso")}</div>`;
  risk.slice(0,4).forEach(r=>{body.appendChild(el("div","brow",`<span class="sig-oz" style="font-size:11.5px">${r.ozet}</span>`));});
  if(!risk.length)body.innerHTML+=`<div style="color:var(--ink2);font-size:11.5px">DSO 130 gün · alacak/net pozisyon canlı bağlanır.</div>`;
}
